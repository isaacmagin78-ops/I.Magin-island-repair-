# Publishes /site to GitHub Pages.
#
# Why this exists: Isaac needed a public URL that works for anyone with no
# login. Vercel deployed but could not be verified from the build container,
# so this is the second, independently checkable route.
#
# NOTE (2026-08-17): `enablement: true` does NOT work here. Run 31997085167
# failed with "Create Pages site failed. Error: Resource not accessible by
# integration" — the default GITHUB_TOKEN cannot create a Pages site. Pages must
# be switched on once by hand: Settings > Pages > Source: GitHub Actions.
# After that this workflow runs fine. Do not rewrite it; it is waiting on a toggle.
name: Publish site to Pages

on:
  push:
    # Was pinned to claude/project-status-update-xbolj2. Everything lives on
    # main now, so pinned to a side branch meant this would never fire again —
    # the same defect the watcher had. Corrected 2026-08-17.
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - id: deployment
        uses: actions/deploy-pages@v4
