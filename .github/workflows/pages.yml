# Publishes /site to GitHub Pages.
#
# Why this exists: Isaac needed a public URL that works for anyone with no
# login. Vercel deployed but could not be verified from the build container,
# so this is the second, independently checkable route.
#
# `configure-pages` with `enablement: true` turns Pages on via the API, so no
# manual settings change is needed.
name: Publish site to Pages

on:
  push:
    branches: [claude/project-status-update-xbolj2]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - id: deployment
        uses: actions/deploy-pages@v4
